name: Case Library Safety Tests
on:
  workflow_dispatch:
  push:
    branches: [feature/case-library-ingestion-m1]
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/case-library-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_judgment_discovery.py tests/test_judgment_publication_policy.py tests/test_judgment_public_visibility.py tests/test_judgment_review_urls.py tests/test_judgment_evidence.py tests/test_judgment_review_evidence.py tests/test_judgment_evidence_checks.py tests/test_independent_judgment_verification.py tests/test_secure_judgment_retrieval.py tests/test_judgment_approval_integration.py tests/test_judgment_source_rights.py -q
      - name: Verify fresh-database migration chain
        env:
          DATABASE_URL: sqlite:///./phase1_migration_test.db
        run: |
          python -m alembic upgrade head
          python -m alembic current
          python - <<'PY'
          from sqlalchemy import create_engine, inspect
          engine = create_engine("sqlite:///./phase1_migration_test.db")
          inspector = inspect(engine)
          assert "judgment_evidence" in inspector.get_table_names()
          columns = {c["name"] for c in inspector.get_columns("judgment_evidence")}
          assert {"primary_sha256", "independent_sha256", "verification_outcome"} <= columns
          indexes = inspector.get_indexes("judgments")
          assert any(i["name"] == "uq_judgment_court_case_year" and i["unique"] for i in indexes)
          PY
      - run: python -m compileall -q app/api/judgment_review.py app/services/judgment_discovery.py app/services/judgment_publication_policy.py scripts/inspect_scc_candidates.py
      - run: python scripts/inspect_scc_candidates.py --offline

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: phase1
          POSTGRES_PASSWORD: phase1_ci_only
          POSTGRES_DB: phase1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phase1 -d phase1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://phase1:phase1_ci_only@localhost:5432/phase1_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Apply all migrations to real PostgreSQL
        run: python -m alembic upgrade head
      - name: Verify judgment tables and constraints in PostgreSQL
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, inspect, text
          import os
          engine = create_engine(os.environ["DATABASE_URL"])
          inspector = inspect(engine)
          tables = set(inspector.get_table_names())
          assert {"judgments", "judgment_evidence", "courts", "sources"} <= tables
          cols = {c["name"] for c in inspector.get_columns("judgment_evidence")}
          assert {"primary_sha256", "independent_sha256", "verification_outcome"} <= cols
          indexes = inspector.get_indexes("judgments")
          assert any(i["name"] == "uq_judgment_court_case_year" and i["unique"] for i in indexes)
          with engine.connect() as connection:
              assert connection.execute(text("SELECT version()")).scalar().startswith("PostgreSQL")
          PY

  official-source-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Diagnose connectivity to multiple registered judgment sources
        if: always()
        run: |
          python - <<'PY'
          import json, socket, ssl, urllib.parse
          from pathlib import Path
          sources=json.loads(Path('data/judgment_source_registry.json').read_text())['sources']
          for source in sources:
              host=urllib.parse.urlsplit(source['index_url']).hostname
              result={'source':source['id'],'host':host,'dns':'failed','tls':'not_attempted'}
              try:
                  addresses=socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)
                  result['dns']='ok'
                  with socket.create_connection((host,443),timeout=5) as sock:
                      with ssl.create_default_context().wrap_socket(sock,server_hostname=host) as tls:
                          result['tls']='ok'
              except (OSError,ssl.SSLError) as exc:
                  result['error_type']=type(exc).__name__
              print(json.dumps(result),flush=True)
          PY
      - name: Fetch ten official SCC candidates into quarantined review report
        run: python scripts/inspect_scc_candidates.py --fetch --output scc-live-review.json
      - name: Upload candidate review report (not published)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scc-live-review
          path: backend/scc-live-review.json
          retention-days: 7
